name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1

      - name: Download XcodeGen
        run: |
          curl -LO https://github.com/yonaskolb/XcodeGen/releases/download/2.38.0/xcodegen.zip
          unzip xcodegen.zip -d xcodegen_bin
          sudo cp xcodegen_bin/bin/xcodegen /usr/local/bin/

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive (unsigned)
        run: |
          xcodebuild archive \
            -project PixelMower.xcodeproj \
            -scheme PixelMower \
            -archivePath ./build/PixelMower.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R ./build/PixelMower.xcarchive/Products/Applications/PixelMower.app ./Payload/
          zip -r PixelMower-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelMower-unsigned.ipa
          path: PixelMower-unsigned.ipa
