name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1

      - name: Show file structure
        run: |
          echo "=== 当前目录文件 ==="
          ls -la
          echo "=== PixelMower 文件夹内容 ==="
          ls -la PixelMower || echo "PixelMower 文件夹不存在"
          echo "=== project.yml 内容 ==="
          cat project.yml || echo "project.yml 不存在"

      - name: Install XcodeGen
        run: |
          echo "=== 下载 XcodeGen ==="
          curl -L -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.38.0/xcodegen.zip
          echo "=== 下载完成，开始解压 ==="
          unzip -o xcodegen.zip
          echo "=== 解压完成，设置权限 ==="
          chmod +x bin/xcodegen
          sudo cp bin/xcodegen /usr/local/bin/
          echo "=== XcodeGen 版本 ==="
          xcodegen --version

      - name: Generate Xcode project
        run: |
          echo "=== 开始生成 Xcode 项目 ==="
          xcodegen generate
          echo "=== 生成完成，检查项目文件 ==="
          ls -la PixelMower.xcodeproj || echo "❌ 项目文件没有生成！"

      - name: Build archive (unsigned)
        run: |
          set -o pipefail
          echo "=== 开始编译 ==="
          xcodebuild archive \
            -project PixelMower.xcodeproj \
            -scheme PixelMower \
            -archivePath ./build/PixelMower.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
          echo "=== 编译结束 ==="

      - name: Upload build log (if exists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Create unsigned IPA
        if: success()
        run: |
          mkdir -p Payload
          cp -R ./build/PixelMower.xcarchive/Products/Applications/PixelMower.app ./Payload/
          zip -r PixelMower-unsigned.ipa Payload
          rm -rf Payload
          echo "=== IPA 创建成功 ==="

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PixelMower-unsigned.ipa
          path: PixelMower-unsigned.ipa
